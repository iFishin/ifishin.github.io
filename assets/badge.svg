<svg xmlns="http://www.w3.org/2000/svg" width="260" height="60" viewBox="0 0 260 60">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f0e5"/>
      <stop offset="100%" style="stop-color:#d4e3ce"/>
    </linearGradient>
    <linearGradient id="fishBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d1482a"/>
      <stop offset="50%" style="stop-color:#e95732"/>
      <stop offset="100%" style="stop-color:#f07854"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="260" height="60" rx="12" fill="url(#bg)"/>
  <rect width="260" height="60" rx="12" fill="none" stroke="rgba(60,80,60,0.15)" stroke-width="1"/>

  <!-- 水墨鱼 - 朝右 -->
  <g transform="translate(20, 16)">
    <!-- 尾鳍 - 淡红渲染 -->
    <path d="M 5,12 C -2,6 -7,7 -9,9 C -10,12 -7,13 -4,13 C -7,14 -10,15 -9,17 C -7,19 -2,18 5,12 Z"
          fill="rgba(233,87,50,0.22)"/>
    <path d="M 5,12 C 0,7 -5,8 -7,10 C -8,12 -5,13 -3,13 C -5,14 -8,15 -7,17 C -5,18 0,17 5,12 Z"
          fill="rgba(233,87,50,0.10)"/>

    <!-- 背鳍 -->
    <path d="M 10,3 C 14,-2 20,-2 22,2 C 20,3 16,4 10,3 Z" fill="rgba(233,87,50,0.28)"/>
    <!-- 腹鳍 -->
    <path d="M 14,17 C 16,21 18,22 20,19 C 18,18 16,17 14,17 Z" fill="rgba(233,87,50,0.18)"/>

    <!-- 鱼身 -->
    <ellipse cx="16" cy="10" rx="12" ry="6.5" fill="url(#fishBody)" opacity="0.88"/>

    <!-- 鱼眼 -->
    <circle cx="24" cy="8" r="2.5" fill="rgba(255,255,255,0.75)"/>
    <circle cx="24.5" cy="8" r="1.2" fill="rgba(20,25,30,0.85)"/>

    <!-- 鳃线 -->
    <path d="M 17,5 C 18,7 18,13 17,15" stroke="rgba(200,70,40,0.15)" stroke-width="0.6" fill="none"/>
  </g>

  <!-- 水纹 -->
  <path d="M 48,26 C 52,23 56,23 60,26" stroke="rgba(80,100,80,0.15)" stroke-width="0.8" fill="none"/>
  <path d="M 50,30 C 54,28 58,28 62,30" stroke="rgba(80,100,80,0.1)" stroke-width="0.8" fill="none"/>

  <!-- 观鱼标题 -->
  <text x="68" y="26" font-family="'Noto Serif SC', 'SimSun', 'STSong', serif" font-size="17" font-weight="500" fill="rgba(60,80,60,0.85)" letter-spacing="5">观 鱼</text>

  <!-- 副标题 -->
  <text x="68" y="44" font-family="'Noto Serif SC', 'SimSun', 'STSong', serif" font-size="11" fill="rgba(60,80,60,0.5)" letter-spacing="2">水墨风格在线鱼缸</text>

  <!-- 印章 -->
  <rect x="220" y="34" width="28" height="16" rx="3" fill="rgba(180,60,50,0.1)" stroke="rgba(180,60,50,0.3)" stroke-width="0.8"/>
  <text x="234" y="46" font-family="'STSong', 'SimSun', serif" font-size="9" fill="rgba(180,60,50,0.6)" text-anchor="middle">观鱼</text>
</svg>
